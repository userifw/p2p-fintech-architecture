<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410"><style>text{font-family:Arial,sans-serif;fill:#111827}.t{font-size:22px;font-weight:700}.s{font-size:15px}.b{fill:#f8fafc;stroke:#64748b;stroke-width:2}.a{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker></defs><text x="45" y="45" class="t">Financial State Transition</text><rect x="40" y="130" width="160" height="75" rx="10" class="b"/><text x="120" y="160" text-anchor="middle" class="t">Request</text><text x="120" y="185" text-anchor="middle" class="s">unique identity</text><rect x="245" y="130" width="170" height="75" rx="10" class="b"/><text x="330" y="160" text-anchor="middle" class="t">Validate</text><text x="330" y="185" text-anchor="middle" class="s">balance + state</text><rect x="460" y="130" width="170" height="75" rx="10" class="b"/><text x="545" y="160" text-anchor="middle" class="t">Reserve</text><text x="545" y="185" text-anchor="middle" class="s">freeze funds</text><rect x="675" y="130" width="170" height="75" rx="10" class="b"/><text x="760" y="160" text-anchor="middle" class="t">Execute</text><text x="760" y="185" text-anchor="middle" class="s">local / external</text><rect x="890" y="130" width="170" height="75" rx="10" class="b"/><text x="975" y="160" text-anchor="middle" class="t">Ledger</text><text x="975" y="185" text-anchor="middle" class="s">traceable effect</text><path d="M200 167H245M415 167H460M630 167H675M845 167H890" class="a"/><text x="245" y="285" class="s">Retries resolve through idempotency rather than repeating the financial effect.</text><text x="245" y="318" class="s">Failures remain explicit so reserved funds and external operations can be reconciled.</text></svg>